server:
  port: 2508
  servlet:
    session:
      timeout: 2592000  # Session有效期30天（秒）
      cookie:
        max-age: 2592000  # 30天（秒），cookie持久化，关闭浏览器不丢失
        http-only: true

spring:
  application:
    name: peacehaven
  session:
    store-type: jdbc           # Session持久化到数据库
    jdbc:
      initialize-schema: always  # 自动建表 SPRING_SESSION / SPRING_SESSION_ATTRIBUTES
  datasource:
    url: jdbc:mysql://rm-bp1544sem4omv4v3ylo.mysql.rds.aliyuncs.com:3306/peacehaven_db_pre
    username: peacehaven_server
    password: XHJdashuaige2508@
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动建表
    show-sql: true
  thymeleaf:
    cache: false # 开发阶段关闭缓存，方便调试 HTML
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

# 阿里云配置
aliyun:
  access-key-id: ${ALIYUN_AK_ID:}
  access-key-secret: ${ALIYUN_AK_SECRET:}
  sms:
    sign-name: ${ALIYUN_SMS_SIGN:}
    template-code: ${ALIYUN_SMS_TEMPLATE:}
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
  # SLS 日志服务配置（留空则仅输出到控制台，填入后自动启用 SLS 上报）
  sls:
    endpoint: cn-hangzhou.log.aliyuncs.com
    project: ${ALIYUN_SLS_PROJECT:}
    log-store: ${ALIYUN_SLS_LOGSTORE:}

# AI 分身系统配置
ai:
  enabled: false
  llm:
    provider: openai
    api-key: ${AI_LLM_API_KEY:}
    base-url: ${AI_LLM_BASE_URL:}
    model: ${AI_LLM_MODEL:deepseek-chat}
    temperature: 0.85
    max-tokens: 200
  embedding:
    api-key: ${AI_EMBED_API_KEY:}
    base-url: ${AI_EMBED_BASE_URL:}
    model: ${AI_EMBED_MODEL:text-embedding-3-small}
    dimensions: 1536
  reply:
    max-per-day: 50
    cooldown-seconds: 30
    random-rate: 0.15
    only-at: false
    context-size: 15
    rag-top-k: 8
  prompt:
    persona-name: ${AI_PERSONA_NAME:}
    custom-instructions: ""
