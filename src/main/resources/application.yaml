server:
  port: 2508
  servlet:
    session:
      timeout: 2592000  # Session有效期30天（秒）
      cookie:
        max-age: 2592000  # 30天（秒），cookie持久化，关闭浏览器不丢失
        http-only: true

spring:
  application:
    name: peacehaven
  session:
    store-type: jdbc           # Session持久化到数据库
    jdbc:
      initialize-schema: always  # 自动建表 SPRING_SESSION / SPRING_SESSION_ATTRIBUTES
  datasource:
    url: jdbc:mysql://rm-bp1544sem4omv4v3ylo.mysql.rds.aliyuncs.com:3306/peacehaven_db
    username: peacehaven_server
    password: XHJdashuaige2508@
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动建表
    show-sql: true
  thymeleaf:
    cache: false # 开发阶段关闭缓存，方便调试 HTML
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

# 阿里云配置
aliyun:
  access-key-id: ${ALIYUN_AK_ID:}
  access-key-secret: ${ALIYUN_AK_SECRET:}
  sms:
    sign-name: ${ALIYUN_SMS_SIGN:}
    template-code: ${ALIYUN_SMS_TEMPLATE:}
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
  # SLS 日志服务配置（留空则仅输出到控制台，填入后自动启用 SLS 上报）
  sls:
    endpoint: cn-hangzhou.log.aliyuncs.com
    project: ${ALIYUN_SLS_PROJECT:}
    log-store: ${ALIYUN_SLS_LOGSTORE:}

# AI 分身系统配置（全栈通义千问）
ai:
  enabled: true
  llm:
    provider: qwen
    api-key: ${AI_LLM_API_KEY:}                                    # 只需配这一个 Key，Embedding 自动复用
    base-url: https://ws-nvivbrq9wdb6pam1.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    model: ${AI_LLM_MODEL:qwen-plus}                               # 性价比最优（¥0.8/M input）
    temperature: 0.85
    max-tokens: 200
  embedding:
    # api-key / base-url 留空，自动复用 llm 的配置
    model: text-embedding-v4                                       # 最新 Embedding 模型
    dimensions: 1024                                               # v4 支持 1024/1536/2048，1024 性价比最优
  reply:
    max-per-day: 10000                                             # 每日回复上限（前期放开多聊）
    cooldown-seconds: 1                                            # 同群最短回复间隔（秒）
    random-rate: 0.2                                               # 群聊无触发条件时随机回复概率
    only-at: false                                                 # true = 仅被@时才回复
    context-size: 15                                               # 拉取最近 N 条群消息作为上下文
    rag-top-k: 8                                                   # RAG 检索 N 条本人历史作为风格示例
    private-chat:
      random-rate: 1                                             # 私聊随机回复概率（1对1应高）
      cooldown-seconds: 1                                          # 私聊最短回复间隔（秒）
      buffer-seconds: 5                                            # 消息聚合等待时间（等待对方发完再回）
      question-rate: 1                                          # 私聊提问回复概率
  prompt:
    persona-name: ${AI_PERSONA_NAME:}
    custom-instructions: ""
