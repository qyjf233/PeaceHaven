server:
  port: 2508
  servlet:
    session:
      timeout: 2592000  # Session有效期30天（秒）
      cookie:
        max-age: 2592000  # 30天（秒），cookie持久化，关闭浏览器不丢失
        http-only: true

spring:
  application:
    name: peacehaven
  session:
    store-type: jdbc           # Session持久化到数据库
    jdbc:
      initialize-schema: always  # 自动建表 SPRING_SESSION / SPRING_SESSION_ATTRIBUTES
  datasource:
    url: jdbc:mysql://rm-bp1544sem4omv4v3ylo.mysql.rds.aliyuncs.com:3306/peacehaven_db
    username: peacehaven_server
    password: XHJdashuaige2508@
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动建表
    show-sql: true
  thymeleaf:
    cache: false # 开发阶段关闭缓存，方便调试 HTML
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

# 阿里云配置
aliyun:
  access-key-id: ${ALIYUN_AK_ID:}
  access-key-secret: ${ALIYUN_AK_SECRET:}
  sms:
    sign-name: ${ALIYUN_SMS_SIGN:}
    template-code: ${ALIYUN_SMS_TEMPLATE:}
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
  # SLS 日志服务配置（留空则仅输出到控制台，填入后自动启用 SLS 上报）
  sls:
    endpoint: cn-hangzhou.log.aliyuncs.com
    project: ${ALIYUN_SLS_PROJECT:}
    log-store: ${ALIYUN_SLS_LOGSTORE:}

# AI 分身系统配置（全栈通义千问）
ai:
  enabled: true
  llm:
    provider: qwen
    api-key: ${AI_LLM_API_KEY:}                                    # 只需配这一个 Key，Embedding 自动复用
    base-url: https://ws-nvivbrq9wdb6pam1.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    model: ${AI_LLM_MODEL:qwen-plus}                               # 性价比最优（¥0.8/M input）
    temperature: 0.7
    max-tokens: 200
  embedding:
    # api-key / base-url 留空，自动复用 llm 的配置
    model: text-embedding-v4                                       # 最新 Embedding 模型
    dimensions: 1024                                               # v4 支持 1024/1536/2048，1024 性价比最优
  reply:
    max-per-day: 10000                                             # 每日回复上限（前期放开多聊）
    cooldown-seconds: 1                                            # 同群最短回复间隔（秒）
    random-rate: 0.2                                               # 群聊无触发条件时随机回复概率
    only-at: false                                                 # true = 仅被@时才回复
    context-size: 15                                               # 拉取最近 N 条群消息作为上下文
    rag-top-k: 12                                                  # RAG 检索 N 条本人历史作为风格示例
    topic-aware: true                                              # 话题感知总开关
    topic-stale-threshold: 3                                       # 话题持续次数阈值（超过则判定过热）
    use-conversation-summary: true                                 # 是否启用对话摘要替代原始上下文
    summary-cache-seconds: 300                                     # 摘要缓存时间（秒）
    private-chat:
      random-rate: 1                                             # 私聊随机回复概率（1对1应高）
      cooldown-seconds: 1                                          # 私聊最短回复间隔（秒）
      buffer-seconds: 5                                            # 消息聚合等待时间（等待对方发完再回）
      question-rate: 1                                          # 私聊提问回复概率
  prompt:
    persona-name: ${AI_PERSONA_NAME:}
    custom-instructions: ""
    style-description: >
      这是用户长期聊天风格统计，不是固定回复模板。
      用户整体表达特点：语言简短（通常3-10字），口语化极强，
      喜欢轻松吐槽，偶尔使用夸张表达制造幽默。
      词汇习惯（低频出现，非每次必须）：
      偶尔使用“牛福”、偶尔使用“哦坤”、偶尔使用“不是哥们”、
      偶尔使用“头大了”、偶尔使用“神了”、偶尔使用“唐完了”、
      偶尔使用“沟槽的XX”（调侃）。
      句式习惯（极少使用）：
      偶尔出现“哦坤啊感谢XX”（已读乱回）、
      偶尔出现“敢不敢XX”（荒诞反问）。
      这些表达不是每次回复都需要出现，只有在语境自然匹配时才使用。
      用户通常不会刻意展示自己的语言特色。
      通常不用表情包和emoji。通常不说“好的”“可以”“没问题”。
      通常不谦虚不客套，不解释自己为什么这样回答。
      整体氛围轻松有趣，但大部分时候只是普通交流。
    anti-anchoring-hint: "当前话题已经讨论较多。如果最新消息是新主题，请自然跟随新主题，不要主动回到旧话题。"
    json-reply-format: true                                        # true=LLM输出JSON(含confidence/memory_used，调试用)  false=纯文本(生产)
    memory-importance-threshold: 0.3                                 # 记忆提取重要性阈值（低于此值丢弃）
    max-memory-entries: 50                                         # 每人记忆条目最大数量
    # 人格维度（从 style-description 分离，抽象的人格特征）
    personality:
      humor-level: high                                            # 幽默感：high/medium/low
      sarcasm-level: medium                                        # 吐槽/调侃
      casual-level: high                                           # 随意程度
      warmth-level: medium                                            # 温暖度
    # 场景 temperature 覆盖（不配则用 llm.temperature 基础值）
    scene-temperature:
      normal: 0.7                                                  # 普通聊天
      humor: 0.85                                                  # 幽默/玩笑场景
      question: 0.65                                               # 提问场景（稍低，更稳定）
  # Persona Engine 学习配置（Phase 4 启用）
  learning:
    enabled: false                                                  # 定时学习总开关
    interval-hours: 6                                               # 学习间隔（小时）
    min-samples: 50                                                 # 最低本人消息数才触发
    max-samples: 200                                                # 学习窗口最大消息数
    bootstrap:
      enabled: true                                                 # 冷启动保护
      samples: 500                                                  # 前 500 条只采集不改 persona
