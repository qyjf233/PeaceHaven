<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营地成员管理 - PeaceHaven Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
        .form-row input { width: 100%; padding: 8px 12px; border: 1px solid var(--admin-border); border-radius: var(--admin-radius); font-size: 0.9rem; }
        .form-actions { display: flex; gap: 8px; margin-top: 16px; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; padding: 28px; width: 90%; max-width: 420px; }
        .modal-content h2 { margin-bottom: 20px; font-size: 1.2rem; }
        .alert-error { padding: 14px 20px; border-radius: var(--admin-radius); margin-bottom: 20px; font-size: 0.95rem; background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; }

        /* Scan Modal */
        .scan-modal .modal-content { max-width: 560px; max-height: 80vh; display: flex; flex-direction: column; }
        .scan-info { font-size: 0.9rem; color: #666; margin-bottom: 12px; }
        .scan-list { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; margin-bottom: 16px; max-height: 350px; }
        .scan-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background 0.15s; }
        .scan-item:hover { background: #f9f9f9; }
        .scan-item:last-child { border-bottom: none; }
        .scan-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .scan-item .nick { font-weight: 600; }
        .scan-item .phone { color: #999; font-size: 0.85rem; margin-left: auto; }
        .scan-select-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .scan-select-bar button { padding: 4px 12px; font-size: 0.82rem; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
        .scan-select-bar button:hover { background: #f0f0f0; }
        .scan-select-bar .count { margin-left: auto; font-size: 0.85rem; color: #888; }
        .scan-empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 0.95rem; }
    </style>
</head>
<body>
<div class="admin-container">
    <header class="admin-header">
        <h1>🏕 营地成员管理</h1>
        <div style="display:flex; gap:10px;">
            <a href="/admin" class="btn-back">← 管理后台</a>
            <a href="/admin/activities" class="btn-back">活动管理</a>
            <a href="/admin/users" class="btn-back">用户管理</a>
            <a href="/" class="btn-back">← 返回前台</a>
        </div>
    </header>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div style="margin-bottom: 16px; display: flex; gap: 10px; align-items: center;">
        <button class="btn btn-primary" onclick="openAddModal()">+ 添加成员</button>
        <button class="btn" style="background:#4CAF50;color:#fff;" onclick="openScanModal()">🔍 一键识别添加</button>
        <span style="margin-left: 8px; color: #777; font-size: 0.9rem;" th:text="'共 ' + ${#lists.size(members)} + ' 人'"></span>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th style="width:80px;">排序</th>
            <th>昵称</th>
            <th style="width:160px;">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${members}">
            <td th:text="${m.sortOrder}"></td>
            <td th:text="${m.nickname}"></td>
            <td class="actions">
                <button class="btn btn-sm btn-info"
                        th:attr="data-id=${m.id},data-nickname=${m.nickname},data-sort=${m.sortOrder}"
                        onclick="openEditModal(this)">编辑</button>
                <form th:action="@{/admin/camp-members/{id}/delete(id=${m.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('确定删除该成员？')">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(members)}">
            <td colspan="3" class="empty-state">暂无营地成员，点击上方按钮添加</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="memberModal">
    <div class="modal-content">
        <h2 id="modalTitle">添加营地成员</h2>
        <form id="memberForm" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">

            <div class="form-row">
                <label>昵称</label>
                <input type="text" id="formNickname" name="nickname" maxlength="50" placeholder="输入成员昵称" required>
            </div>

            <div class="form-row">
                <label>排序权重（数字越小越靠前）</label>
                <input type="number" id="formSortOrder" name="sortOrder" value="0" min="0">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
            </div>
        </form>
    </div>
</div>

<!-- Scan Modal -->
<div class="modal-overlay scan-modal" id="scanModal">
    <div class="modal-content">
        <h2>🔍 识别营地成员</h2>
        <div class="scan-info" id="scanInfo">正在扫描...</div>
        <div class="scan-select-bar" id="scanBar" style="display:none;">
            <button onclick="toggleAll(true)">全选</button>
            <button onclick="toggleAll(false)">全不选</button>
            <span class="count" id="scanCount"></span>
        </div>
        <div class="scan-list" id="scanList"></div>
        <div class="form-actions">
            <button class="btn btn-primary" id="scanSubmitBtn" onclick="submitScan()" disabled>确认处理</button>
            <button class="btn btn-secondary" onclick="closeScanModal()">取消</button>
        </div>
    </div>
</div>

<script>
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '添加营地成员';
        document.getElementById('memberForm').action = '/admin/camp-members';
        document.getElementById('formNickname').value = '';
        document.getElementById('formSortOrder').value = '0';
        document.getElementById('memberModal').classList.add('active');
        document.getElementById('formNickname').focus();
    }

    function openEditModal(btn) {
        document.getElementById('modalTitle').textContent = '编辑营地成员';
        var id = btn.dataset.id;
        document.getElementById('memberForm').action = '/admin/camp-members/' + id;
        document.getElementById('formNickname').value = btn.dataset.nickname;
        document.getElementById('formSortOrder').value = btn.dataset.sort || '0';
        document.getElementById('memberModal').classList.add('active');
        document.getElementById('formNickname').focus();
    }

    function closeModal() {
        document.getElementById('memberModal').classList.remove('active');
    }

    // 点击遮罩关闭
    document.getElementById('memberModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // === 一键识别添加 ===
    var scanCandidates = [];

    function openScanModal() {
        var modal = document.getElementById('scanModal');
        modal.classList.add('active');
        document.getElementById('scanInfo').textContent = '正在扫描 User 表中营地为“长安”的用户...';
        document.getElementById('scanList').innerHTML = '';
        document.getElementById('scanBar').style.display = 'none';
        document.getElementById('scanSubmitBtn').disabled = true;

        fetch('/admin/camp-members/api/scan')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                scanCandidates = data.candidates || [];
                document.getElementById('scanInfo').textContent =
                    '营地“长安”共 ' + data.totalChangAn + ' 人，其中 ' + data.alreadyInList + ' 人已在成员表，以下 ' + scanCandidates.length + ' 人待处理：';

                if (scanCandidates.length === 0) {
                    document.getElementById('scanList').innerHTML = '<div class="scan-empty">暂无待添加成员，所有长安用户已在成员表中 ✓</div>';
                    return;
                }

                document.getElementById('scanBar').style.display = 'flex';
                renderScanList();
                document.getElementById('scanSubmitBtn').disabled = false;
            })
            .catch(function() {
                document.getElementById('scanInfo').textContent = '扫描失败，请刷新页面重试';
            });
    }

    function renderScanList() {
        var html = scanCandidates.map(function(u, i) {
            return '<label class="scan-item">' +
                '<input type="checkbox" data-uid="' + u.id + '" checked onchange="updateScanCount()">' +
                '<span class="nick">' + (u.nickname || '未设置昵称') + '</span>' +
                '</label>';
        }).join('');
        document.getElementById('scanList').innerHTML = html;
        updateScanCount();
    }

    function toggleAll(checked) {
        document.querySelectorAll('#scanList input[type=checkbox]').forEach(function(cb) {
            cb.checked = checked;
        });
        updateScanCount();
    }

    function updateScanCount() {
        var total = document.querySelectorAll('#scanList input[type=checkbox]').length;
        var checked = document.querySelectorAll('#scanList input[type=checkbox]:checked').length;
        document.getElementById('scanCount').textContent = '已选 ' + checked + ' / ' + total +
            '（未选的 ' + (total - checked) + ' 人将移出长安）';
    }

    function submitScan() {
        var checkboxes = document.querySelectorAll('#scanList input[type=checkbox]');
        var checkedIds = [];
        var allIds = [];

        checkboxes.forEach(function(cb) {
            allIds.push(parseInt(cb.dataset.uid));
            if (cb.checked) checkedIds.push(parseInt(cb.dataset.uid));
        });

        var uncheckedCount = allIds.length - checkedIds.length;
        var msg = '将添加 ' + checkedIds.length + ' 人到成员表';
        if (uncheckedCount > 0) msg += '，并将 ' + uncheckedCount + ' 人移出长安';
        if (!confirm(msg + '，确认执行？')) return;

        var btn = document.getElementById('scanSubmitBtn');
        btn.disabled = true;
        btn.textContent = '处理中...';

        fetch('/admin/camp-members/api/batch-process', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': document.querySelector('input[name=_csrf]').value
            },
            body: JSON.stringify({ checkedIds: checkedIds, allIds: allIds })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                alert('完成！添加了 ' + data.addedCount + ' 人，移出了 ' + data.removedCount + ' 人');
                location.reload();
            } else {
                alert('处理失败：' + (data.message || '未知错误'));
                btn.disabled = false;
                btn.textContent = '确认处理';
            }
        })
        .catch(function() {
            alert('网络错误，请重试');
            btn.disabled = false;
            btn.textContent = '确认处理';
        });
    }

    function closeScanModal() {
        document.getElementById('scanModal').classList.remove('active');
    }

    document.getElementById('scanModal').addEventListener('click', function(e) {
        if (e.target === this) closeScanModal();
    });
</script>
</body>
</html>
