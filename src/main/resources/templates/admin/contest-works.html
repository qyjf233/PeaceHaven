<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品审核 - PeaceHaven Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .activity-list { display: grid; gap: 16px; }
        .activity-item {
            background: var(--admin-surface);
            border-radius: var(--admin-radius);
            box-shadow: var(--admin-shadow);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
        }
        .activity-item:hover {
            border-color: var(--admin-primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .activity-info h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--admin-header); }
        .activity-info p { font-size: 0.85rem; color: var(--admin-text-muted); }
        .activity-stats { display: flex; gap: 20px; align-items: center; }
        .stat-badge {
            text-align: center;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .stat-badge.total { background: #e3f2fd; color: #1565C0; }
        .stat-badge.pending { background: #fff3e0; color: #E65100; }
        .stat-badge .num { font-size: 1.1rem; display: block; line-height: 1.2; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--admin-text-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="admin-container">
    <header class="admin-header">
        <h1>📝 作品审核</h1>
        <div style="display:flex; gap:10px;">
            <a href="/admin" class="btn-back">← 管理后台</a>
            <a href="/" class="btn-back">返回前台</a>
        </div>
    </header>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="activity-list" th:if="${!#lists.isEmpty(activities)}">
        <a th:each="act : ${activities}"
           th:href="@{/admin/contest-works/{id}(id=${act.id})}"
           class="activity-item">
            <div class="activity-info">
                <h3 th:text="${act.title}">活动标题</h3>
                <p th:text="${act.summary != null ? act.summary : ''}">活动简介</p>
            </div>
            <div class="activity-stats">
                <div class="stat-badge total">
                    <span class="num" th:text="${contestWorkRepository.countByActivityId(act.id)}">0</span>
                    作品总数
                </div>
                <div class="stat-badge pending"
                     th:with="pendingCount=${contestWorkRepository.countByActivityIdAndStatus(act.id, T(com.potato.peacehaven.entity.ContestWork.WorkStatus).PENDING)}">
                    <span class="num" th:text="${pendingCount}">0</span>
                    待审核
                </div>
            </div>
        </a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(activities)}">
        <div class="icon">📭</div>
        <p>暂无启用作品提交的活动</p>
        <p style="font-size:0.85rem; margin-top:6px;">请先在活动管理中为活动勾选"启用作品提交流程"</p>
    </div>
</div>
</body>
</html>
