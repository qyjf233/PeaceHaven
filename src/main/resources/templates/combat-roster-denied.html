<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common(title='无权限 - PeaceHaven')}"></th:block>
    <style>
        .denied-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 120px 20px 60px;
        }
        .denied-box {
            text-align: center;
            background: var(--bg-card);
            border: var(--border-card);
            border-radius: 16px;
            padding: 60px 40px;
            box-shadow: var(--shadow-md);
            max-width: 420px;
        }
        .denied-box .icon { font-size: 3rem; margin-bottom: 16px; }
        .denied-box h2 { color: var(--text-primary); font-size: 1.4rem; margin-bottom: 12px; }
        .denied-box p { color: var(--text-secondary); margin-bottom: 24px; }
        .denied-box a {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 20px;
            background: var(--accent-primary);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .denied-box a:hover { opacity: 0.9; }
    </style>
</head>
<body data-theme="day">
<div th:replace="~{fragments/navbar :: navbar(page='', mode='bare', prefix='/#')}"></div>
<div class="denied-page">
    <div class="denied-box">
        <div class="icon">🔒</div>
        <h2>无访问权限</h2>
        <p th:text="${errorMessage ?: '此页面仅管理组成员可见'}">此页面仅管理组成员可见</p>
        <a href="/">返回首页</a>
    </div>
</div>
</body>
</html>
