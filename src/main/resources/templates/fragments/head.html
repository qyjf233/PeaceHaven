<!-- ============================================
     PeaceHaven 通用 <head> 公共元素
     用法: <th:block th:replace="~{fragments/head :: common(title='页面标题')}"></th:block>
     参数: title - 页面标题
     ============================================ -->
<th:block th:fragment="common(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">PeaceHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" th:href="@{/images/peacehaven_favicon.ico}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/memory-theme.css}">
</th:block>
