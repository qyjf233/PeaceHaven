<!-- ============================================
     PeaceHaven 通用导航栏组件
     用法: <div th:replace="~{fragments/navbar :: navbar(page='home', mode='full', prefix='#')}"></div>
     参数:
       page   - 当前页面标识: home / about / team / activities / combat-roster / benefits
       mode   - 导航栏模式: full(完整导航) / simple(仅logo+主题切换) / bare(仅logo)
       prefix - 锚点链接前缀: '#'(首页) / '/#'(其他页面)
       isManager - 是否显示战斗组链接(由Controller传入)
     ============================================ -->

<!-- 导航栏片段 -->
<nav th:fragment="navbar(page, mode, prefix)" class="navbar" id="navbar">
    <div class="nav-container">
        <a th:href="${prefix == '#' ? '#' : '/'}" class="nav-logo">
            <img th:src="@{/images/peacehaven_logo_1.png}" alt="PeaceHaven Logo" class="logo-icon">
            <span class="logo-text"><span class="logo-full">PeaceHaven · </span>长安</span>
        </a>

        <!-- 完整导航链接 -->
        <ul th:if="${mode == 'full'}" class="nav-links" id="navLinks">
            <li><a th:href="${prefix + 'hero'}" class="nav-link" th:classappend="${page == 'home'} ? 'active'">首页</a></li>
            <li><a th:href="${prefix + 'about'}" class="nav-link" th:classappend="${page == 'about'} ? 'active'">营地简介</a></li>
            <li><a th:href="${prefix + 'team'}" class="nav-link" th:classappend="${page == 'team'} ? 'active'">管理组</a></li>
            <li><a th:href="${page == 'home' ? '#activities' : '/activities'}" class="nav-link" th:classappend="${page == 'activities'} ? 'active'">活动</a></li>
            <!-- 战斗组链接：首页由isManager控制，战斗组页面始终显示 -->
            <li th:if="${page == 'combat-roster' or (isManager != null and isManager)}"><a href="/combat-roster" class="nav-link" th:classappend="${page == 'combat-roster'} ? 'active'">战斗组</a></li>
            <li><a th:href="${prefix + 'benefits'}" class="nav-link" th:classappend="${page == 'benefits'} ? 'active'">福利</a></li>
        </ul>

        <div th:if="${mode != 'bare'}" class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <span class="theme-icon-day">☀️</span>
                <span class="theme-icon-night">🌙</span>
            </button>
            <!-- 汉堡菜单仅完整模式显示 -->
            <button th:if="${mode == 'full'}" class="nav-hamburger" id="hamburger" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>
